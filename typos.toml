# Tokens the spellchecker collides with in this tree: unparseable is a
# valid English variant used in coverage test messages, INSER comes from
# pluralized SQL keywords (INSERTs) in seed test messages.
[default.extend-words]
unparseable = "unparseable"
INSER = "INSER"
gam = "gam"

# Source dumps are transcribed artifacts (scripture quotes with the
# original spelling kept), and web/static holds vendored minified assets:
# both are machine-generated or immutable, meaningless to a spellchecker.
[files]
extend-exclude = ["dumps/**", "web/static/*.min.js"]
